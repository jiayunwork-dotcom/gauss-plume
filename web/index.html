<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gauss-plume · 高斯烟羽扩散核算台</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --line: #dde2e8;
    --ink: #1f2733;
    --muted: #6b7684;
    --accent: #2f6fed;
    --err: #c0392b;
    --ok: #1e8e5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 14px 24px;
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  main {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 20px;
    padding: 20px 24px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
  }
  .panel h2 { margin: 0 0 12px; font-size: 15px; }
  label { display: block; margin: 10px 0 2px; color: var(--muted); font-size: 12px; }
  input[type=number], input[type=text], select {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 13px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .seg { display: flex; gap: 6px; margin: 10px 0 2px; }
  .seg button {
    flex: 1;
    padding: 6px 4px;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .seg button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .actions button {
    padding: 8px 12px;
    border: 0;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    cursor: pointer;
  }
  .actions button.secondary { background: #eef2f7; color: var(--ink); border: 1px solid var(--line); }
  .actions button:disabled { opacity: 0.55; cursor: wait; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  .metric { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .metric .cell { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .metric .cell b { display: block; font-size: 16px; }
  .metric .cell span { color: var(--muted); font-size: 11px; }
  #error {
    display: none;
    background: #fdecea;
    color: var(--err);
    border: 1px solid #f5c6c0;
    border-radius: 6px;
    padding: 10px 12px;
    margin-top: 12px;
    white-space: pre-wrap;
    font-size: 13px;
  }
  #chart { margin-top: 14px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>gauss-plume · 高斯烟羽扩散核算台</h1>
  <p>源强 Q + 源（有效源高或烟囱抬升）+ 风速 + 稳定度 A–F + 下风向距离 → 受体浓度（结果全部来自后端求解）</p>
</header>

<main>
  <section class="panel">
    <h2>输入算例</h2>

    <div class="seg" id="sourceMode">
      <button type="button" data-mode="height" class="active">直接给有效源高</button>
      <button type="button" data-mode="stack">烟囱 + Briggs 抬升</button>
    </div>

    <div id="fields-height">
      <label>有效源高 H（m）</label>
      <input type="number" step="any" id="f-height" value="0">
    </div>

    <div id="fields-stack" style="display:none">
      <div class="row">
        <div>
          <label>烟囱高度 hs（m）</label>
          <input type="number" step="any" id="f-hs" value="40">
        </div>
        <div>
          <label>出口速度 ws（m/s）</label>
          <input type="number" step="any" id="f-ws" value="12">
        </div>
      </div>
      <div class="row">
        <div>
          <label>出口内径 rs（m）</label>
          <input type="number" step="any" id="f-rs" value="1.2">
        </div>
        <div>
          <label>烟气温度 Ts（K）</label>
          <input type="number" step="any" id="f-ts" value="420">
        </div>
      </div>
      <div class="row">
        <div>
          <label>环境温度 Ta（K）</label>
          <input type="number" step="any" id="f-ta" value="288">
        </div>
        <div>
          <label>逆温顶 z_inv（m，0=不限）</label>
          <input type="number" step="any" id="f-zinv" value="0">
        </div>
      </div>
    </div>

    <div class="row">
      <div>
        <label>源强 Q（g/s）</label>
        <input type="number" step="any" id="f-q" value="5">
      </div>
      <div>
        <label>风速 u（m/s）</label>
        <input type="number" step="any" id="f-u" value="3">
      </div>
    </div>
    <label>稳定度</label>
    <select id="f-stab">
      <option value="A">A · 强不稳定</option>
      <option value="B">B · 不稳定</option>
      <option value="C">C · 弱不稳定</option>
      <option value="D" selected>D · 中性</option>
      <option value="E">E · 稳定</option>
      <option value="F">F · 强稳定</option>
    </select>

    <div class="row3">
      <div>
        <label>受体 x（m）</label>
        <input type="number" step="any" id="f-x" value="500">
      </div>
      <div>
        <label>受体 y（m）</label>
        <input type="number" step="any" id="f-y" value="0">
      </div>
      <div>
        <label>受体 z（m）</label>
        <input type="number" step="any" id="f-z" value="0">
      </div>
    </div>

    <div class="row3">
      <div>
        <label>轴线起点（m）</label>
        <input type="number" step="any" id="f-x0" value="50">
      </div>
      <div>
        <label>轴线终点（m）</label>
        <input type="number" step="any" id="f-x1" value="2000">
      </div>
      <div>
        <label>轴线点数</label>
        <input type="number" step="1" id="f-n" value="40">
      </div>
    </div>

    <div class="actions">
      <button id="btn-conc">计算受体浓度</button>
      <button id="btn-axis">计算下风向曲线</button>
      <button id="btn-example" class="secondary">加载示例（地面源）</button>
    </div>
    <div id="error"></div>
  </section>

  <section class="panel">
    <h2>核算结果</h2>
    <div id="result">
      <div class="note">提交算例后在这里列出受体浓度、扩散参数与有效源高。</div>
    </div>
    <div id="chart"></div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
